name: Screenshot su Windows

# Fotografa le finestre principali su Windows, a zoom 100% e 150%, per
# controllare l'aspetto e aggiornare le immagini della documentazione.
# Si avvia a mano dal tab Actions, oppure con un push su un ramo "screenshot/...".
on:
  workflow_dispatch:
  push:
    branches:
      - "screenshot/**"

jobs:
  screenshot:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        zoom: ["100", "150"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Schermo da portatile (1920x1080): il runner parte da 1024x768
      - name: Risoluzione dello schermo
        continue-on-error: true
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Installa dipendenze
        run: pip install -r requirements.txt pillow

      - name: Screenshot
        env:
          CONTABILINO_ZOOM: ${{ matrix.zoom }}
        run: python strumenti/screenshot.py screenshot-${{ matrix.zoom }}

      - name: Tempi di risposta dell'interfaccia
        env:
          CONTABILINO_ZOOM: ${{ matrix.zoom }}
        run: |
          python strumenti/misura_reattivita.py > screenshot-${{ matrix.zoom }}/tempi.txt
          type screenshot-${{ matrix.zoom }}\tempi.txt

      # Prova dell'eseguibile: tema e icona devono esserci anche nell'.exe
      - name: Compila e avvia l'eseguibile
        if: matrix.zoom == '100'
        shell: powershell
        run: |
          python strumenti/versione_exe.py
          pyinstaller --onefile --windowed --name Contabilino --icon risorse/contabilino.ico --hidden-import openpyxl --version-file versione_exe.txt --add-data "risorse/contabilino.ico;risorse" main.py
          Copy-Item esempi/contabilino-esempio.db dist/contabilino.db
          Start-Process explorer.exe (Resolve-Path dist)
          Start-Sleep -Seconds 4
          $app = Start-Process -FilePath dist/Contabilino.exe -WorkingDirectory dist -PassThru
          Start-Sleep -Seconds 12
          python -c "from PIL import ImageGrab; ImageGrab.grab(all_screens=True).save('screenshot-100/10-eseguibile.png')"
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

      - name: Carica le immagini
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-zoom-${{ matrix.zoom }}
          path: screenshot-${{ matrix.zoom }}

  # Mac e Linux: compila l'app, la avvia davvero (finestra di benvenuto e finestra
  # principale) e controlla che resti aperta; screenshot dove il sistema lo permette.
  prova-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compila l'app
        run: |
          pip install -r requirements.txt
          pyinstaller --windowed --name Contabilino --icon risorse/contabilino.icns --osx-bundle-identifier it.spacefiller.contabilino --hidden-import openpyxl main.py
      - name: Avvia l'app
        run: |
          mkdir -p prova-mac
          prova() {
            dist/Contabilino.app/Contents/MacOS/Contabilino > prova-mac/$1.log 2>&1 &
            PID=$!
            sleep 12
            screencapture -x prova-mac/$1.png || true
            if kill -0 $PID 2>/dev/null; then echo "OK    $1: l'app è aperta" | tee -a prova-mac/controlli.txt; kill $PID
            else echo "ERRORE $1: l'app si è chiusa" | tee -a prova-mac/controlli.txt; cat prova-mac/$1.log; fi
          }
          cp esempi/contabilino-esempio.db dist/contabilita-2026.db
          prova benvenuto
          mv dist/contabilita-2026.db dist/contabilino.db
          prova principale
          ! grep -q ERRORE prova-mac/controlli.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-mac
          path: prova-mac

  prova-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compila l'eseguibile
        run: |
          sudo apt-get update
          sudo apt-get install -y tk8.6 libtk8.6 xvfb imagemagick
          pip install -r requirements.txt
          pyinstaller --onefile --windowed --name Contabilino --hidden-import openpyxl main.py
      - name: Avvia l'eseguibile
        run: |
          mkdir -p prova-linux
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          prova() {
            dist/Contabilino > prova-linux/$1.log 2>&1 &
            PID=$!
            sleep 10
            import -window root prova-linux/$1.png || true
            if kill -0 $PID 2>/dev/null; then echo "OK    $1: l'app è aperta" | tee -a prova-linux/controlli.txt; kill $PID
            else echo "ERRORE $1: l'app si è chiusa" | tee -a prova-linux/controlli.txt; cat prova-linux/$1.log; fi
          }
          cp esempi/contabilino-esempio.db dist/contabilita-2026.db
          prova benvenuto
          mv dist/contabilita-2026.db dist/contabilino.db
          prova principale
          ! grep -q ERRORE prova-linux/controlli.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-linux
          path: prova-linux
